name: ROS 2 CI & Quality Checks

on:
  push:
    branches: [ humble, jazzy ]
  pull_request:
    branches: [ humble, jazzy ]

jobs:
  python_syntax_and_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Check Python Syntax (Compile Check)
        run: |
          python -m compileall src/panda_moveit2_tutorials/

      - name: Lint Python Code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/panda_moveit2_tutorials/ --count --select=E9,F63,F7,F82 --show-source --statistics

  package_metadata_and_structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Required Package Files
        run: |
          test -f src/panda_moveit2_tutorials/setup.cfg || exit 1
          test -f src/panda_moveit2_tutorials/panda_moveit2_tutorials/__init__.py || exit 1
          test -f src/panda_moveit2_cpp/CMakeLists.txt || exit 1
          test -f src/panda_moveit2_cpp/package.xml || exit 1
          echo "Package structures and configuration files are present."
